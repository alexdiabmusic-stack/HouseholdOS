name: Validate Household OS
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: householdos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.5.3'
      - name: Check Edge Function and provider imports
        run: deno check --config supabase/functions/deno.json supabase/functions/household-api/index.ts
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build iOS simulator app
        run: xcodebuild -project HouseholdOS.xcodeproj -scheme HouseholdOS -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/HouseholdOSDerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Launch app and capture core screens
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for key,values in d["devices"].items() if "iOS" in key for x in values if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          app_path=/tmp/HouseholdOSDerivedData/Build/Products/Debug-iphonesimulator/HouseholdOS.app
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app_path/Info.plist")
          xcrun simctl install "$device_id" "$app_path"
          mkdir -p /tmp/householdos-screenshots
          for tab in today lists tasks money household; do
            xcrun simctl terminate "$device_id" "$bundle_id" || true
            xcrun simctl launch "$device_id" "$bundle_id" --ui-smoke-test --tab "$tab"
            sleep 3
            xcrun simctl io "$device_id" screenshot "/tmp/householdos-screenshots/$tab.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: householdos-simulator-screens
          path: /tmp/householdos-screenshots
