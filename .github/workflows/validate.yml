name: Validate Household OS
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: householdos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build iOS simulator app
        run: xcodebuild -project HouseholdOS.xcodeproj -scheme HouseholdOS -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/HouseholdOSDerivedData CODE_SIGNING_ALLOWED=NO build
