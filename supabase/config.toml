project_id = "householdos"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "householdos://auth/callback"
additional_redirect_urls = ["householdos://auth/callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Verify your Household OS email"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Household OS password"
content_path = "./templates/recovery.html"

[functions.household-api]
# The handler verifies bearer tokens with Auth; webhooks use provider signatures.
verify_jwt = false
import_map = "./functions/deno.json"
